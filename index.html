<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Counter App di Deborah Porchia, sviluppatrice Full Stack in formazione. Un counter app semplice che permette di aumentare, diminuire e resettare un contatore con interazioni dinamiche e responsive.">
    
    <meta property="og:title" content="Counter App | HTML, CSS & JavaScript">
    <meta property="og:description" content="Una Counter App realizzata con HTML, CSS e JavaScript. Permette di aumentare, diminuire e resettare il contatore con un'interfaccia moderna, responsive e ispirata allo stile iPhone.">
    <meta property="og:image" content="https://deborah-porchia.github.io/images/preview.png">
    <meta property="og:url" content="https://deborah-porchia.github.io/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="it_IT">
    
    <link rel="icon" href="images/favicon.png" type="image/png">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <p class="badge">Start2Impact</p>
            <h1>Counter App</h1>
        </header>

        <div class="counter-display" id="input">0</div>

        <div class="buttons">
            <button class="btn btn1" id="aumenta" type="button">
                <span class="btn-icon">+</span>
                Aumenta
            </button>
            <button class="btn btn2" id="resetta" type="button">
                <span class="btn-icon">⟳</span>
                Resetta
            </button>
            <button class="btn btn3" id="Diminuisci" type="button">
                <span class="btn-icon">-</span>
                Diminuisci
            </button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
