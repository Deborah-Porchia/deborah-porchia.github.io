<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <p class="badge">Start2Impact</p>
            <h1>Counter App</h1>
        </header>

        <div class="counter-display" id="input">0</div>

        <div class="buttons">
            <button class="btn btn1" id="aumenta" type="button">
                <span class="btn-icon">+</span>
                Aumenta
            </button>
            <button class="btn btn2" id="resetta" type="button">
                <span class="btn-icon">⟳</span>
                Resetta
            </button>
            <button class="btn btn3" id="Diminuisci" type="button">
                <span class="btn-icon">-</span>
                Diminuisci
            </button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
